<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width-device=width" initial="1.0">
  <title>Basic Quiz Form</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
  <main class="box">
    <h1>✅ Basic HTML and CSS Quiz</h1>
    <form action="">
      <div class="quiz-item box">
        <label for="q1">1. What does the acronym CSS stand for?</label>
        <input type="text" id="q1" name="q1">
      </div>
      <div class="quiz-item box">
        <label for="q2">2. How are id and class attributes selects in CSS?</label>
        <textarea id="q2" name="q2"></textarea>
      </div>
      <div class="quiz-item box">
        <label for="q3">3. Which of the following is a valid in css
          comment?</label>
        <select id="q3" name="q3">
          <option value="" selected disabled></option>
          <option value="a">A. &it;!--This is comment---</option>
          <option value="b">B. */This is comment*/</option>
          <option value="c">C. *//This is comment//*</option>
        </select>
      </div>
      <div class="quiz-item box">
        <label for="q4">4. What is the button margin given this
          declaration?</label>
        <code>margin: 10px 15px 15px</code>
        <input type="number" id="q4" name="q4">
      </div>
      <button type="submit">Submit Quiz for Grading</button>
    </form>
  </main>
</body>

</html>
