<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Contact Us | Whitewater Rafting</title>
  <meta name="description"
    content="Contact our whitewater rafting company for information about rafting trips,reservations, and adventures">
  <meta name="author" content="Namazzi Allen Joan">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/logo.jpg" alt="Whitewater Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <section class="company-info">
      <h2>Company Information</h2>

      <p><strong> Address</strong>,Uganda</p>
      <p><strong>Phone</strong>+256748172045</p>
      <p><strong>Email</strong>Allenjoan@gmail.com</p>
    </section>

    <section>
      <div class="map">
        <iframe
          src=" https://www.google.com/maps/embed?pb=1m18!1m12!1m3!1d3989.6777848155025!2d33.1687358!3d0.48090069999999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177e7e77df17684d%3A0x3b54f5c24b4d3124!2sWhite%20Nile%20Rafting%20Ltd%20%7C%20White%20Water%20Rafting%20%7C%20Rafting%20in%20Uganda%20%7C%20Water%20Rafting%20Uganda%20%7C%20White%20Nile%20Rafting%20Uganda!5e0!3m2!1sen!2sug!4v1791033370387!5m2!1sen!2sug"
          width="300" height="200" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin" title="Map Showing our location">
        </iframe>
      </div>
    </section>

    <section class="employees">
      <h2>We Are Here To Serve You</h2>
      <div class="employee-list">
        <figure>
          <img src="images/employee1.jpg" alt="Employee 1">
          <figcaption> Ester Wales - Leading Rafting Guide</figcaption>
        </figure>

        <figure>
          <img src="images/employee2.jpg" alt="Employee 2">
          <figcaption>Joram Washington - Safety Coordinator</figcaption>
        </figure>

        <figure>
          <img src="images/employee3.png" alt="Employee 3">
          <figcaption>Andrew smith - Trip Coordinator</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Send Me Message</h2>
    </section>

    <section>
      <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="Email"> Email Address:</label>
        <input type="email" id="email" name="email" required>


        <input type="radio" id="general" name="purpose" value="general">
        <label for="general">General Inquiry</label>

        <input type="radio" id="reservation" name="purpose" value="reservation">
        <label for="reservionat">Reservation Question</label>

        <input type="radio" id="suggestion" name="purpose" value="suggestion">
        <label for="suggestion">Website Suggestion</label>

        <label for="massage">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <input type="checkbox" id="newsletter" name="newsletter">
        <label for="newsletter">Please subscribe me to the monthly newsletter </label>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Whitewater Rafting | Namazzi Allen Joan</p>

    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Visit us on Facebook">
      </a>

      <a href="https://twitter.com">
        <img src="images/twitter.png" alt="Visit us on Twitter">
      </a>

      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Visit us on Instagram">
      </a>
    </nav>

  </footer>
</body>

</html>
